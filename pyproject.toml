[project]
name = "support-agent-demo"
version = "0.1.0"
description = "Local, synthetic customer support agent demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1,<2",
  "langchain>=1,<2",
  "langchain-ollama>=1,<2",
  "pydantic>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
